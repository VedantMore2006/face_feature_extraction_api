version: "3.9"

services:
  face-feature-extraction-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: face-feature-extraction-api
    container_name: face-feature-extraction-api
    restart: unless-stopped
    environment:
      - EXTRACTION_API_KEY=${EXTRACTION_API_KEY}
    volumes:
      - api_sessions:/app/reports/api_sessions
      - api_uploads:/app/reports/api_uploads
      - api_vectors:/app/reports/api_vectors
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 384M

volumes:
  api_sessions:
  api_uploads:
  api_vectors:
